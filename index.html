<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14532d"><link rel="manifest" href="manifest.json"><title>J F Agro | Sales & Dealer Management</title>
<style>
:root{--g:#14532d;--g2:#166534;--bg:#f3f7f4;--line:#dce7df;--ink:#17251c;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,Arial}.hidden{display:none!important}button,input,select{font:inherit}button{cursor:pointer}.login{max-width:390px;margin:8vh auto;background:white;padding:28px;border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px #143d2512}.logo{font-weight:900;color:var(--g);font-size:25px}.sub{color:var(--muted);margin:4px 0 22px}.field{display:grid;gap:6px;margin:13px 0}.field label{font-weight:650;font-size:12px;color:#475569}.field input,.field select{padding:11px;border:1px solid #cbd5d0;border-radius:9px;width:100%;background:white}.btn{border:0;background:var(--g2);color:white;border-radius:9px;padding:10px 14px;font-weight:700}.btn.alt{background:#e7f3eb;color:var(--g)}.btn.red{background:#fee2e2;color:#991b1b}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#103d25;color:white;padding:20px;position:sticky;top:0;height:100vh}.side .logo{color:white}.side small{color:#bbf7d0}.nav{display:grid;gap:6px;margin-top:25px}.nav button{background:none;color:#d1fae5;border:0;text-align:left;padding:11px;border-radius:9px}.nav button.active,.nav button:hover{background:#21623a;color:white}.main{min-width:0}.top{background:white;border-bottom:1px solid var(--line);padding:15px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:2}.top h1{font-size:19px;margin:0}.wrap{padding:22px;max-width:1400px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:17px}.muted{color:var(--muted)}.num{font-size:25px;font-weight:850;margin-top:7px}.head{display:flex;align-items:center;justify-content:space-between;margin:22px 0 12px;gap:10px}.tablebox{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{border-collapse:collapse;width:100%;min-width:620px}th,td{text-align:left;padding:11px 13px;border-bottom:1px solid #edf2ee}th{background:#f8faf9;color:#64748b;font-size:11px;text-transform:uppercase}tr:last-child td{border:0}.status{font-size:12px;background:#e8f5ec;color:#166534;padding:4px 9px;border-radius:20px}.msg{padding:12px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:9px;margin-bottom:14px}.modal{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:15px;z-index:5}.modal.show{display:flex}.dialog{background:white;border-radius:14px;padding:20px;width:min(550px,100%);max-height:90vh;overflow:auto}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:15px}.error{color:#b91c1c}.foot{font-size:11px;color:var(--muted);margin-top:18px}@media(max-width:800px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:13px}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{white-space:nowrap;padding:8px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px}.top{padding:12px}.side small{display:block}}@media(max-width:440px){.cards{gap:8px}.card{padding:12px}.num{font-size:20px}.top h1{font-size:16px}}
</style></head><body>
<div id="login" class="login"><div class="logo">J F AGRO</div><div class="sub">SALES & DEALER MANAGEMENT · CHUADANGA</div><h2>Sign in</h2><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn" style="width:100%" id="signIn">Sign in securely</button><p id="loginError" class="error"></p><p class="foot">Use the email and password created in Supabase Authentication. © All Rights Reserved — Zahirryhan Shakib.</p></div>
<div id="app" class="app hidden"><aside class="side"><div class="logo">J F AGRO</div><small>SALES & DEALER MANAGEMENT</small><nav class="nav"><button class="active" data-page="dashboard">▦ Dashboard</button><button data-page="dealers">♙ Dealers</button><button data-page="products">▣ Products</button><button data-page="sales">▤ Sales</button><button data-page="collections">৳ Collections</button><button data-page="team">♧ Team & Assignments</button></nav><p class="foot" style="color:#bbf7d0">J F Agro Private Limited<br>Chuadanga, Bangladesh</p></aside><main class="main"><header class="top"><h1 id="pageTitle">Dashboard</h1><div><span class="status" id="who">Signed in</span> <button class="btn alt" id="logout">Logout</button></div></header><div class="wrap" id="content"></div></main></div>
<div id="modal" class="modal"><div class="dialog"><h2 id="modalTitle">Add</h2><div id="modalBody"></div><div class="actions"><button class="btn alt" id="cancel">Cancel</button><button class="btn" id="save">Save</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://nkqgugarrhkszeybcityp.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_rsuy9tw50H60ZfbHK-HFrg_xKB2It1U';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
let user=null,profile=null,page='dashboard',saveAction=null;
const $=id=>document.getElementById(id),money=n=>new Intl.NumberFormat('en-BD',{style:'currency',currency:'BDT',maximumFractionDigits:2}).format(Number(n)||0),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){alert(s)}
async function start(){const {data:{session}}=await sb.auth.getSession();if(session)await enter(session.user);else showLogin()}
function showLogin(){$('login').classList.remove('hidden');$('app').classList.add('hidden')}
async function enter(u){user=u;let {data:p,error}=await sb.from('profiles').select('full_name,role,is_active').eq('user_id',u.id).single();if(error||!p||!p.is_active){await sb.auth.signOut();$('loginError').textContent='Your profile is unavailable or inactive. Contact the administrator.';return showLogin()}profile=p;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=(p.full_name||u.email)+' · '+p.role;document.querySelector('[data-page="team"]').classList.toggle('hidden',p.role!=='admin');await render()}
$('signIn').onclick=async()=>{ $('loginError').textContent='';let {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginError').textContent=error.message;return}await enter(data.user)};
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')$('signIn').click()});$('logout').onclick=async()=>{await sb.auth.signOut();user=null;profile=null;showLogin()};sb.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')showLogin()});
document.querySelectorAll('.nav button').forEach(b=>b.onclick=async()=>{if(b.classList.contains('hidden'))return;page=b.dataset.page;document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));await render()});
function table(headers,rows){return `<div class="tablebox"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="muted">No records yet</td></tr>`}</tbody></table></div>`}
async function render(){ $('pageTitle').textContent=page[0].toUpperCase()+page.slice(1);let c=$('content');c.innerHTML='<div class="msg">Loading secure cloud data…</div>';try{if(page==='dashboard')await dashboard(c);if(page==='dealers')await dealers(c);if(page==='products')await products(c);if(page==='sales')await sales(c);if(page==='collections')await collections(c);if(page==='team')await team(c)}catch(e){c.innerHTML=`<div class="msg">Could not load data: ${esc(e.message||e)}. Check that the setup SQL ran successfully and your account is active.</div>`}}
async function dashboard(c){let [d,s,p,col]=await Promise.all([sb.from('dealers').select('id',{count:'exact',head:true}),sb.from('invoices').select('total').eq('status','posted'),sb.from('products').select('id',{count:'exact',head:true}),sb.from('collections').select('amount')]);for(let x of [d,s,p,col])if(x.error)throw x.error;let salesTotal=(s.data||[]).reduce((a,x)=>a+Number(x.total),0),colTotal=(col.data||[]).reduce((a,x)=>a+Number(x.amount),0);c.innerHTML=`<div class="cards"><div class="card"><div class="muted">Dealers accessible</div><div class="num">${d.count||0}</div></div><div class="card"><div class="muted">Posted Sales</div><div class="num">${money(salesTotal)}</div></div><div class="card"><div class="muted">Collections</div><div class="num">${money(colTotal)}</div></div><div class="card"><div class="muted">Products</div><div class="num">${p.count||0}</div></div></div><div class="head"><h2>Cloud connection</h2><span class="status">Connected · ${profile.role}</span></div><div class="card">Your data is loaded from Supabase. Dealer visibility is restricted by the database Row Level Security policies. ${profile.role==='admin'?'As administrator, you can manage all dealer records and assignments.':'You can view only dealers assigned to your employee account.'}</div>`}
async function dealers(c){let {data,error}=await sb.from('dealers').select('id,dealer_code,name,contact_person,phone,address,area,opening_balance,is_active').order('name');if(error)throw error;c.innerHTML=`<div class="head"><h2>Dealer directory</h2>${profile.role==='admin'?'<button class="btn" id="addDealer">+ Add dealer</button>':''}</div>${table(['Dealer','Code','Phone','Area','Opening balance','Status'],(data||[]).map(d=>`<tr><td><b>${esc(d.name)}</b></td><td>${esc(d.dealer_code||'—')}</td><td>${esc(d.phone||'—')}</td><td>${esc(d.area||d.address||'—')}</td><td>${money(d.opening_balance)}</td><td>${d.is_active?'Active':'Inactive'}</td></tr>`).join(''))}`;if(profile.role==='admin')$('addDealer').onclick=()=>openDealer()}
function openDealer(){showModal('Add dealer',`<div class="field"><label>Dealer name *</label><input id="dName"></div><div class="field"><label>Dealer code</label><input id="dCode"></div><div class="field"><label>Contact person</label><input id="dContact"></div><div class="field"><label>Phone</label><input id="dPhone"></div><div class="field"><label>Area</label><input id="dArea"></div><div class="field"><label>Address</label><input id="dAddress"></div><div class="field"><label>Opening balance (BDT)</label><input id="dOpening" type="number" min="0" step="0.01" value="0"></div>`,async()=>{let name=$('dName').value.trim();if(!name)throw Error('Dealer name is required');let {error}=await sb.from('dealers').insert({name,dealer_code:$('dCode').value.trim()||null,contact_person:$('dContact').value.trim(),phone:$('dPhone').value.trim(),area:$('dArea').value.trim(),address:$('dAddress').value.trim(),opening_balance:Number($('dOpening').value)||0,created_by:user.id});if(error)throw error;await render()})}
async function products(c){let {data,error}=await sb.from('products').select('product_code,name,unit,selling_price,is_active').order('name');if(error)throw error;c.innerHTML=`<div class="head"><h2>Products</h2></div>${table(['Product','Code','Unit','Selling price','Status'],(data||[]).map(p=>`<tr><td><b>${esc(p.name)}</b></td><td>${esc(p.product_code||'—')}</td><td>${esc(p.unit)}</td><td>${money(p.selling_price)}</td><td>${p.is_active?'Active':'Inactive'}</td></tr>`).join(''))}`}
async function sales(c){let {data,error}=await sb.from('invoices').select('invoice_no,invoice_date,dealer_id,total,status').order('invoice_date',{ascending:false}).limit(100);if(error)throw error;let ids=[...new Set((data||[]).map(x=>x.dealer_id))],names={};if(ids.length){let r=await sb.from('dealers').select('id,name').in('id',ids);if(r.error)throw r.error;(r.data||[]).forEach(x=>names[x.id]=x.name)}c.innerHTML=`<div class="head"><h2>Sales register</h2></div>${table(['Date','Invoice','Dealer','Total','Status'],(data||[]).map(x=>`<tr><td>${esc(x.invoice_date)}</td><td>${esc(x.invoice_no)}</td><td>${esc(names[x.dealer_id]||'Dealer')}</td><td>${money(x.total)}</td><td>${esc(x.status)}</td></tr>`).join(''))}`}
async function collections(c){let {data,error}=await sb.from('collections').select('collection_date,dealer_id,amount,payment_method,reference_no').order('collection_date',{ascending:false}).limit(100);if(error)throw error;let ids=[...new Set((data||[]).map(x=>x.dealer_id))],names={};if(ids.length){let r=await sb.from('dealers').select('id,name').in('id',ids);if(r.error)throw r.error;(r.data||[]).forEach(x=>names[x.id]=x.name)}c.innerHTML=`<div class="head"><h2>Collections register</h2></div>${table(['Date','Dealer','Amount','Method','Reference'],(data||[]).map(x=>`<tr><td>${esc(x.collection_date)}</td><td>${esc(names[x.dealer_id]||'Dealer')}</td><td>${money(x.amount)}</td><td>${esc(x.payment_method)}</td><td>${esc(x.reference_no||'—')}</td></tr>`).join(''))}`}
async function team(c){if(profile.role!=='admin')throw Error('Administrator access required');let {data,error}=await sb.from('profiles').select('user_id,full_name,role,is_active').order('full_name');if(error)throw error;let ids=(data||[]).map(x=>x.user_id),emails={};if(ids.length){let {data:as,error:ae}=await sb.from('dealer_assignments').select('employee_id,dealer_id');if(ae)throw ae;window.assignments=as||[]}c.innerHTML=`<div class="head"><h2>Team profiles</h2></div><p class="msg">Create employee accounts in Supabase Authentication → Users. Their profile defaults to employee. Use the assignments table to grant dealer access; RLS enforces these permissions.</p>${table(['Employee','Role','Status','Assigned dealers'],(data||[]).map(x=>`<tr><td>${esc(x.full_name||'Unnamed')}</td><td>${esc(x.role)}</td><td>${x.is_active?'Active':'Inactive'}</td><td>${(window.assignments||[]).filter(a=>a.employee_id===x.user_id).length}</td></tr>`).join(''))}`}
function showModal(title,html,fn){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('show');saveAction=fn}
$('cancel').onclick=()=>$('modal').classList.remove('show');$('save').onclick=async()=>{try{$('save').disabled=true;await saveAction();$('modal').classList.remove('show');notify('Saved successfully')}catch(e){notify(e.message||String(e))}finally{$('save').disabled=false}};
start();
</script></body></html>
